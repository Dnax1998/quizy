<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Kodów QR z Tekstem</title>
    <!-- Biblioteka do obsługi kodów QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        textarea:focus {
            border-color: #007bff;
            outline: none;
        }
        #qrcode {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }
        #qrcode img {
            border: 5px solid white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-radius: 4px;
        }
        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Generator Kodów QR</h2>
        <textarea id="textInput" placeholder="Wpisz tutaj dowolny tekst, wiadomość lub link...">Witaj! To jest przykładowy tekst ukryty w kodzie QR.</textarea>
        
        <div id="qrcode"></div>

        <button class="btn" id="downloadBtn" style="display:none;">Pobierz kod QR (PNG)</button>
    </div>

    <script>
        const textInput = document.getElementById('textInput');
        const qrcodeContainer = document.getElementById('qrcode');
        const downloadBtn = document.getElementById('downloadBtn');

        // Inicjalizacja obiektu QR
        let qrCodeInstance = new QRCode(qrcodeContainer, {
            text: textInput.value,
            width: 220,
            height: 220,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });

        // Funkcja aktualizująca kod przy pisaniu
        function updateQRCode() {
            const text = textInput.value;
            qrcodeContainer.innerHTML = ""; // Czyszczenie starego kodu
            
            if (text.trim() !== "") {
                qrCodeInstance = new QRCode(qrcodeContainer, {
                    text: text,
                    width: 220,
                    height: 220,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
                downloadBtn.style.display = "block";
            } else {
                downloadBtn.style.display = "none";
            }
        }

        textInput.addEventListener('input', updateQRCode);

        // Obsługa pobierania wygenerowanego kodu
        downloadBtn.addEventListener('click', function() {
            const img = qrcodeContainer.querySelector('img');
            if (img) {
                const imgSrc = img.src;
                const link = document.createElement('a');
                link.href = imgSrc;
                link.download = 'kod-qr.png';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        });
    </script>

</body>
</html>
