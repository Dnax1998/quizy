<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video Watermark Eraser</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .video-wrapper {
            position: relative;
            display: inline-block;
            max-width: 100%;
        }
        #maskCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
            touch-action: none;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans select-none">

    <header class="border-b border-slate-800 bg-slate-950/50 py-4 px-6 flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-wide text-indigo-400">Video Watermark Eraser</h1>
        <span class="text-xs bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-3 py-1 rounded-full font-medium">Auto-Responsive Canvas</span>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-6 flex flex-col gap-6">

        <div id="dropZone" class="border-2 border-dashed border-slate-700 hover:border-indigo-500 bg-slate-800/40 rounded-2xl p-8 sm:p-12 text-center transition-all cursor-pointer flex flex-col items-center justify-center">
            <p class="text-lg font-medium text-slate-200">Kliknij lub przeciągnij wideo tutaj</p>
            <p class="text-sm text-slate-500 mt-2">MP4, MOV, WEBM</p>
            <input type="file" id="videoInput" accept="video/*" class="hidden">
        </div>

        <div id="editorSection" class="hidden flex-col gap-6">
            <div class="bg-slate-950 p-2 sm:p-4 rounded-2xl border border-slate-800 flex flex-col items-center justify-center">
                <div class="video-wrapper rounded-lg overflow-hidden shadow-2xl">
                    <video id="videoPlayer" class="block max-h-[60vh] w-auto" playsinline controls></video>
                    <canvas id="maskCanvas"></canvas>
                </div>
                <p class="text-xs text-indigo-300 mt-3 text-center">💡 Kliknij bezpośrednio na napis na wideo i zamaluj go czerwoną plamą.</p>
            </div>

            <div class="bg-slate-800/50 border border-slate-700/50 p-5 rounded-2xl space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 bg-slate-900/60 p-4 rounded-xl border border-slate-700/60">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Pędzel: <span id="brushSizeVal" class="text-indigo-400">25px</span></label>
                        <input type="range" id="brushSize" min="5" max="80" value="25" class="w-full accent-indigo-500 bg-slate-700 rounded-lg cursor-pointer">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Siła rozmycia: <span id="blurVal" class="text-indigo-400">6px</span></label>
                        <input type="range" id="blurSize" min="2" max="25" value="6" class="w-full accent-indigo-500 bg-slate-700 rounded-lg cursor-pointer">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Przezroczystość: <span id="opacityVal" class="text-indigo-400">80%</span></label>
                        <input type="range" id="maskOpacity" min="30" max="100" value="80" class="w-full accent-indigo-500 bg-slate-700 rounded-lg cursor-pointer">
                    </div>
                </div>

                <div class="flex gap-3">
                    <button id="clearMaskBtn" class="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm py-2.5 px-3 rounded-xl transition">Wyczyść zaznaczenie</button>
                    <button id="processBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 px-4 rounded-xl shadow-lg transition">Usuń Znak Wodny</button>
                </div>
            </div>
        </div>

        <div id="progressSection" class="hidden bg-slate-800 border border-slate-700 p-6 rounded-2xl text-center space-y-4">
            <h3 class="text-lg font-medium text-slate-200">Przetwarzanie klatek wideo...</h3>
            <div class="w-full bg-slate-700 h-3 rounded-full overflow-hidden">
                <div id="progressBar" class="bg-indigo-500 h-full w-0 transition-all duration-100"></div>
            </div>
        </div>

        <div id="resultSection" class="hidden bg-slate-800 border border-slate-700 p-6 rounded-2xl flex flex-col items-center gap-4 text-center">
            <h3 class="text-lg font-semibold text-emerald-400">Gotowe! Wygenerowano wyczyszczone wideo.</h3>
            <video id="resultVideo" class="max-h-[50vh] rounded-lg border border-slate-700" controls playsinline></video>
            <a id="downloadBtn" download="video_bez_znaku.mp4" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-8 rounded-xl transition shadow-lg">📥 Pobierz wideo</a>
            <button id="resetBtn" class="text-xs text-slate-400 underline mt-2">Przetwórz kolejny plik</button>
        </div>

    </main>

    <script>
        const dropZone = document.getElementById('dropZone');
        const videoInput = document.getElementById('videoInput');
        const editorSection = document.getElementById('editorSection');
        const videoPlayer = document.getElementById('videoPlayer');
        const maskCanvas = document.getElementById('maskCanvas');
        const ctx = maskCanvas.getContext('2d');

        const brushSizeInput = document.getElementById('brushSize');
        const brushSizeVal = document.getElementById('brushSizeVal');
        const blurSizeInput = document.getElementById('blurSize');
        const blurVal = document.getElementById('blurVal');
        const maskOpacityInput = document.getElementById('maskOpacity');
        const opacityVal = document.getElementById('opacityVal');

        const clearMaskBtn = document.getElementById('clearMaskBtn');
        const processBtn = document.getElementById('processBtn');
        const progressSection = document.getElementById('progressSection');
        const progressBar = document.getElementById('progressBar');
        const resultSection = document.getElementById('resultSection');
        const resultVideo = document.getElementById('resultVideo');
        const downloadBtn = document.getElementById('downloadBtn');
        const resetBtn = document.getElementById('resetBtn');

        let isDrawing = false;
        let selectedFile = null;

        dropZone.addEventListener('click', () => videoInput.click());
        videoInput.addEventListener('change', (e) => { if (e.target.files.length) handleFile(e.target.files[0]); });

        function handleFile(file) {
            selectedFile = file;
            videoPlayer.src = URL.createObjectURL(file);
            dropZone.classList.add('hidden');
            editorSection.classList.remove('hidden');
            editorSection.classList.add('flex');
        }

        videoPlayer.addEventListener('loadedmetadata', syncCanvasSize);
        window.addEventListener('resize', syncCanvasSize);

        function syncCanvasSize() {
            if (!videoPlayer.videoWidth) return;
            maskCanvas.width = videoPlayer.videoWidth;
            maskCanvas.height = videoPlayer.videoHeight;
        }

        brushSizeInput.addEventListener('input', (e) => brushSizeVal.textContent = `${e.target.value}px`);
        blurSizeInput.addEventListener('input', (e) => blurVal.textContent = `${e.target.value}px`);
        maskOpacityInput.addEventListener('input', (e) => opacityVal.textContent = `${e.target.value}%`);

        // Przeliczanie pozycji myszy/dotyku uwzględniające skalowanie ekranu
        function getPos(e) {
            const rect = maskCanvas.getBoundingClientRect();
            const scaleX = maskCanvas.width / rect.width;
            const scaleY = maskCanvas.height / rect.height;
            return {
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY
            };
        }

        maskCanvas.addEventListener('pointerdown', startDrawing);
        maskCanvas.addEventListener('pointermove', draw);
        window.addEventListener('pointerup', stopDrawing);

        function startDrawing(e) {
            videoPlayer.pause();
            isDrawing = true;
            syncCanvasSize();
            
            const pos = getPos(e);
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, (brushSizeInput.value * (maskCanvas.width / maskCanvas.clientWidth)) / 2, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(239, 68, 68, 0.8)';
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }

        function draw(e) {
            if (!isDrawing) return;
            const pos = getPos(e);
            
            ctx.lineWidth = brushSizeInput.value * (maskCanvas.width / maskCanvas.clientWidth);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = 'rgba(239, 68, 68, 0.8)';
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        }

        function stopDrawing() { isDrawing = false; ctx.beginPath(); }
        clearMaskBtn.addEventListener('click', () => ctx.clearRect(0, 0, maskCanvas.width, maskCanvas.height));

        processBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            const imgData = ctx.getImageData(0, 0, maskCanvas.width, maskCanvas.height);
            let hasMask = false;
            for (let i = 3; i < imgData.data.length; i += 4) {
                if (imgData.data[i] > 20) { hasMask = true; break; }
            }

            if (!hasMask) {
                alert("Najpierw zamaluj napis na wideo!");
                return;
            }

            editorSection.classList.add('hidden');
            progressSection.classList.remove('hidden');

            const vw = videoPlayer.videoWidth;
            const vh = videoPlayer.videoHeight;

            const processingCanvas = document.createElement('canvas');
            processingCanvas.width = vw;
            processingCanvas.height = vh;
            const pCtx = processingCanvas.getContext('2d');

            const featheredMask = document.createElement('canvas');
            featheredMask.width = vw;
            featheredMask.height = vh;
            const fmCtx = featheredMask.getContext('2d');
            fmCtx.filter = 'blur(6px)';
            fmCtx.drawImage(maskCanvas, 0, 0);

            const blurredFrame = document.createElement('canvas');
            blurredFrame.width = vw;
            blurredFrame.height = vh;
            const bfCtx = blurredFrame.getContext('2d');

            const stream = processingCanvas.captureStream(30);
            let recorder;
            try { recorder = new MediaRecorder(stream, { mimeType: 'video/webm' }); }
            catch (e) { recorder = new MediaRecorder(stream); }

            const chunks = [];
            recorder.ondataavailable = (e) => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/mp4' });
                const resultUrl = URL.createObjectURL(blob);
                resultVideo.src = resultUrl;
                downloadBtn.href = resultUrl;
                progressSection.classList.add('hidden');
                resultSection.classList.remove('hidden');
            };

            const blurPx = blurSizeInput.value;
            const opacityPct = maskOpacityInput.value / 100;

            videoPlayer.currentTime = 0;
            await videoPlayer.play();
            recorder.start();

            function renderFrame() {
                if (videoPlayer.paused || videoPlayer.ended) {
                    recorder.stop();
                    return;
                }

                pCtx.globalCompositeOperation = 'source-over';
                pCtx.globalAlpha = 1.0;
                pCtx.drawImage(videoPlayer, 0, 0, vw, vh);

                bfCtx.clearRect(0, 0, vw, vh);
                bfCtx.save();
                bfCtx.filter = `blur(${blurPx}px)`;
                bfCtx.drawImage(videoPlayer, 0, 0, vw, vh);
                bfCtx.restore();

                bfCtx.globalCompositeOperation = 'destination-in';
                bfCtx.drawImage(featheredMask, 0, 0);

                pCtx.globalCompositeOperation = 'source-over';
                pCtx.globalAlpha = opacityPct;
                pCtx.drawImage(blurredFrame, 0, 0);

                const pct = Math.floor((videoPlayer.currentTime / videoPlayer.duration) * 100);
                progressBar.style.width = `${pct}%`;

                requestAnimationFrame(renderFrame);
            }

            renderFrame();
        });

        resetBtn.addEventListener('click', () => location.reload());
    </script>
</body>
</html>
