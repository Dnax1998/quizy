<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Użytkownika PTC - Demo UI</title>
  <!-- Tailwind CSS z CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM z CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel do kompilacji Reacta w przeglądarce -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- PROSTY ODTWARZACZ REKLAM (MODAL/WIDOK) ---
    function AdPlayer({ onComplete, onCancel }) {
      const [timeLeft, setTimeLeft] = useState(10);
      const [isFinished, setIsFinished] = useState(false);

      useEffect(() => {
        if (timeLeft > 0) {
          const timer = setTimeout(() => setTimeLeft(timeLeft - 1), 1000);
          return () => clearTimeout(timer);
        } else {
          setIsFinished(true);
        }
      }, [timeLeft]);

      return (
        <div class="fixed inset-0 bg-slate-950/95 z-50 flex flex-col items-center justify-center p-4">
          <div class="w-full max-w-xl bg-slate-900 border border-slate-700 rounded-2xl p-6 text-center shadow-2xl space-y-6">
            <div class="flex justify-between items-center border-b border-slate-800 pb-4">
              <span class="text-xs font-bold uppercase tracking-wider text-indigo-400">Odtwarzacz Reklam PTC</span>
              <button onClick={onCancel} class="text-slate-400 hover:text-white text-sm">✕ Zamknij</button>
            </div>

            <div class="h-48 bg-slate-800 rounded-xl flex flex-col items-center justify-center border border-dashed border-slate-700">
              <p class="text-slate-400 text-sm">Miejsce na ramkę iframe z reklamą sponsorowaną</p>
              <p class="text-xs text-slate-500 mt-2">https://example-crypto-ad.com</p>
            </div>

            <div class="space-y-3">
              {!isFinished ? (
                <div>
                  <p class="text-xs text-slate-400">Pozostały czas do zaliczenia nagrody:</p>
                  <p class="text-4xl font-mono font-bold text-amber-400 mt-1">{timeLeft}s</p>
                </div>
              ) : (
                <div class="space-y-4">
                  <p class="text-emerald-400 font-bold text-lg">🎉 Reklama obejrzana pomyślnie!</p>
                  <button
                    onClick={() => onComplete(0.10)}
                    class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 font-bold text-white rounded-xl shadow-lg transition"
                  >
                    Odbierz +$0.10 USD i wróć do Pulpitu
                  </button>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // --- GŁÓWNY APPS / DASHBOARD ---
    function App() {
      const [view, setView] = useState('dashboard');
      const [userData, setUserData] = useState({
        username: 'mobile_tester',
        balanceUsd: 12.50,
        cpBalance: 154200,
        currentStage: 4,
        pendingAds: 5
      });
      const [packQty, setPackQty] = useState(1);

      const handleBuyPacks = (e) => {
        e.preventDefault();
        const cost = packQty * 1.0;
        if (userData.balanceUsd >= cost) {
          setUserData(prev => ({
            ...prev,
            balanceUsd: prev.balanceUsd - cost,
            cpBalance: prev.cpBalance + (packQty * 11000)
          }));
          alert(`Pomyślnie kupiono ${packQty} AdPack(i)! Otrzymujesz +${(packQty * 11000).toLocaleString()} CP.`);
        } else {
          alert('Brak wystarczających środków na saldzie USD!');
        }
      };

      const handleAdFinished = (reward) => {
        setUserData(prev => ({
          ...prev,
          balanceUsd: prev.balanceUsd + reward,
          pendingAds: Math.max(0, prev.pendingAds - 1)
        }));
        setView('dashboard');
      };

      return (
        <div class="max-w-4xl mx-auto p-4 md:p-6 space-y-6">
          {/* HEADER */}
          <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl flex flex-col md:flex-row justify-between items-center gap-4 shadow-lg">
            <div>
              <h1 class="text-xl font-bold text-white">Witaj, {userData.username}! 👋</h1>
              <p class="text-xs text-slate-400">Demo Interfejsu Panelu Użytkownika</p>
            </div>
            <div class="flex gap-2">
              <button onClick={() => alert('Przekierowanie do depozytu USDT...')} class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 font-bold text-xs rounded-lg transition">Wpłać USDT</button>
              <button onClick={() => alert('Przekierowanie do wypłaty...')} class="px-4 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 font-bold text-xs rounded-lg transition">Wypłać</button>
            </div>
          </div>

          {/* KARTY STATYSTYK */}
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl shadow">
              <span class="text-xs font-semibold text-slate-400 uppercase">Saldo Zarobione</span>
              <p class="text-2xl font-mono font-bold text-emerald-400 mt-1">${userData.balanceUsd.toFixed(2)} USD</p>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl shadow">
              <span class="text-xs font-semibold text-slate-400 uppercase">Punkty CP</span>
              <p class="text-2xl font-mono font-bold text-amber-400 mt-1">{userData.cpBalance.toLocaleString()} CP</p>
            </div>
            <div class="bg-slate-900 border border-indigo-500/30 p-5 rounded-xl shadow flex items-center justify-between">
              <div>
                <span class="text-xs font-semibold text-indigo-300 uppercase">Reklamy Dziś</span>
                <p class="text-2xl font-mono font-bold text-white mt-1">{userData.pendingAds} dostępnych</p>
              </div>
              <button
                disabled={userData.pendingAds === 0}
                onClick={() => setView('ad-player')}
                class={`px-3 py-2 rounded-lg font-bold text-xs transition ${userData.pendingAds > 0 ? 'bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg' : 'bg-slate-800 text-slate-500 cursor-not-allowed'}`}
              >
                Oglądaj
              </button>
            </div>
          </div>

          {/* PASEK POSTĘPU STAGE */}
          <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl space-y-3">
            <div class="flex justify-between items-center text-sm">
              <span class="font-bold text-white">Poziom: STAGE {userData.currentStage}</span>
              <span class="text-xs text-indigo-400 font-mono">Próg: 100,000 - 249,999 CP</span>
            </div>
            <div class="w-full h-3 bg-slate-950 rounded-full overflow-hidden border border-slate-800">
              <div class="h-full bg-gradient-to-r from-indigo-500 to-purple-500 rounded-full" style={{ width: '54%' }}></div>
            </div>
            <div class="flex justify-between text-xs text-slate-400">
              <span>Postęp etapu: 54%</span>
              <span>Brakuje: 95,799 CP do Stage 5</span>
            </div>
          </div>

          {/* KALKULATOR / ZAKUP ADPACKA */}
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl space-y-4">
              <h3 class="font-bold text-white">Kup AdPacki ($1.00 USDT / szt.)</h3>
              <form onSubmit={handleBuyPacks} class="space-y-4">
                <div>
                  <label class="text-xs text-slate-400 block mb-1">Liczba pakietów:</label>
                  <input
                    type="number"
                    min="1"
                    value={packQty}
                    onChange={(e) => setPackQty(Math.max(1, parseInt(e.target.value) || 1))}
                    class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white font-mono text-sm"
                  />
                </div>
                <div class="p-3 bg-slate-950 rounded-lg text-xs space-y-1 font-mono text-slate-300">
                  <p>Koszt: <span class="text-emerald-400 font-bold">${(packQty * 1).toFixed(2)} USD</span></p>
                  <p>Zyskasz: <span class="text-amber-400 font-bold">+{(packQty * 11000).toLocaleString()} CP</span></p>
                </div>
                <button type="submit" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 font-bold text-sm text-white rounded-lg transition">
                  Kup Teraz (Z Salda)
                </button>
              </form>
            </div>

            {/* TABELA TRANSAKCJI */}
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl space-y-3">
              <h3 class="font-bold text-white">Ostatnia Aktywność</h3>
              <div class="space-y-2 text-xs font-mono">
                <div class="flex justify-between p-2.5 bg-slate-950 rounded border border-slate-800">
                  <span>[Zarobek] Reklama #101</span>
                  <span class="text-emerald-400">+$0.10 USD</span>
                </div>
                <div class="flex justify-between p-2.5 bg-slate-950 rounded border border-slate-800">
                  <span>[Podatek Dzienny]</span>
                  <span class="text-red-400">-200 CP</span>
                </div>
                <div class="flex justify-between p-2.5 bg-slate-950 rounded border border-slate-800">
                  <span>[Zakup] 10 AdPacków</span>
                  <span class="text-amber-400">+110,000 CP</span>
                </div>
              </div>
            </div>
          </div>

          {/* MODAL ODTWARZACZA */}
          {view === 'ad-player' && (
            <AdPlayer
              onComplete={handleAdFinished}
              onCancel={() => setView('dashboard')}
            />
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
