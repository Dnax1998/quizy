<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podsumowanie i Lokalizacje Produktów</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { margin: 0; padding: 20px; background: #f4f6f9; color: #1e293b; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { font-size: 1.8rem; margin-bottom: 8px; color: #0f172a; display: flex; align-items: center; gap: 10px; }
        p.subtitle { color: #64748b; margin-top: 0; margin-bottom: 24px; }
        
        .card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        .search-box { width: 100%; padding: 12px 16px; font-size: 16px; border: 1px solid #cbd5e1; border-radius: 12px; margin-bottom: 20px; outline: none; }
        .search-box:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }

        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th { background: #f8fafc; padding: 12px 16px; font-weight: 600; color: #475569; border-bottom: 2px solid #e2e8f0; }
        td { padding: 12px 16px; border-bottom: 1px solid #e2e8f0; vertical-align: top; }
        tr:hover { background: #f8fafc; }

        .badge-cartons { background: #dbeafe; color: #1e40af; padding: 4px 10px; border-radius: 20px; font-weight: 600; display: inline-block; }
        .badge-pieces { background: #f1f5f9; color: #475569; padding: 4px 10px; border-radius: 20px; font-weight: 600; display: inline-block; }
        
        .location-tag { display: inline-block; background: #fef3c7; color: #92400e; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; margin: 2px; border: 1px solid #fde68a; }
        
        .back-link { display: inline-block; margin-bottom: 16px; text-decoration: none; color: #2563eb; font-weight: 600; font-size: 14px; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-link">← Wróć do magazynu</a>
    <h1>📦 Podsumowanie Stanów i Lokalizacji</h1>
    <p class="subtitle">Zbiorcze zestawienie wszystkich produktów w magazynie wraz z sumą kartonów/sztuk oraz miejscem składowania.</p>

    <div class="card">
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 Szukaj produktu po nazwie lub kodzie...">
        
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Nazwa produktu / Kod</th>
                        <th>Łącznie kartonów</th>
                        <th>Łącznie sztuk</th>
                        <th>Lokalizacje (Regał, Poziom, Kolumna)</th>
                    </tr>
                </thead>
                <tbody id="summaryTableBody">
                    <tr><td colspan="4" style="text-align: center; color: #64748b; padding: 30px;">Ładowanie danych z magazynu...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // Konfiguracja Firebase (ta sama co w głównej aplikacji)
    const firebaseConfig = {
        apiKey: "AIzaSyAbMTVozOhIXesvF59REYnIOtmo-V5qimk",
        authDomain: "forevermagazyn.firebaseapp.com",
        projectId: "forevermagazyn",
        storageBucket: "forevermagazyn.firebasestorage.app",
        messagingSenderId: "251843942343",
        appId: "1:251843942343:web:2c81227b12ab4ad0052be2"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    let allSlotsData = {};
    let slotBatches = {};
    let productsList = [];

    // Pobieranie danych w czasie rzeczywistym
    function initDataListener() {
        // Pobierz produkty
        db.collection("products").onSnapshot(prodSnap => {
            productsList = [];
            prodSnap.forEach(doc => productsList.push({ id: doc.id, ...doc.data() }));
            
            // Pobierz sloty
            db.collection("slots").onSnapshot(slotSnap => {
                allSlotsData = {};
                slotSnap.forEach(doc => allSlotsData[doc.id] = doc.data());
                
                // Pobierz partie (batches) ze wszystkich slotów
                db.collectionGroup("batches").onSnapshot(batchSnap => {
                    slotBatches = {};
                    batchSnap.forEach(doc => {
                        const locId = doc.ref.parent.parent.id;
                        if (!slotBatches[locId]) slotBatches[locId] = [];
                        slotBatches[locId].push({ id: doc.id, ...doc.data() });
                    });
                    
                    generateSummary();
                });
            });
        });
    }

    // Przetwarzanie i agregacja danych
    function generateSummary() {
        const summaryMap = {};

        // Inicjalizacja mapy dla każdego produktu z bazy
        productsList.forEach(prod => {
            summaryMap[prod.id] = {
                name: prod.name,
                code: prod.code || 'Brak kodu',
                totalCartons: 0,
                totalPieces: 0,
                locations: []
            };
        });

        // Dodanie produktów spoza bazy (gdyby były wpisane "ręcznie" w sloty)
        const getOrCreateCustomProduct = (name, code) => {
            const key = name || 'Nieznany produkt';
            if (!summaryMap[key]) {
                summaryMap[key] = {
                    name: name,
                    code: code || 'Brak kodu',
                    totalCartons: 0,
                    totalPieces: 0,
                    locations: []
                };
            }
            return summaryMap[key];
        };

        // Przejście przez wszystkie sloty i ich partie
        Object.entries(slotBatches).forEach(([locId, batches]) => {
            batches.forEach(b => {
                const prodKey = b.productId || b.productName;
                if (!prodKey) return;

                let item = summaryMap[b.productId] || getOrCreateCustomProduct(b.productName, b.productCode);
                
                item.totalCartons += parseInt(b.cartons || 0);
                item.totalPieces += parseInt(b.pieces || 0);

                // Formatowanie ładnego opisu lokalizacji np. "Regał A, Poziom 5, Kolumna 20"
                // Format ID lokacji w Twojej apce to np. "RA-P5-K20" lub "R-A-P5-K20" -> rozbijamy bezpiecznie
                const parsedLoc = formatLocationName(locId);
                if (!item.locations.includes(parsedLoc)) {
                    item.locations.push(parsedLoc);
                }
            });
        });

        // Przetwarzanie slotów starszego typu (bez kolekcji batches, bezpośrednio w slocie)
        Object.entries(allSlotsData).forEach(([locId, slotData]) => {
            if (slotData && slotData.productName && (!slotBatches[locId] || slotBatches[locId].length === 0)) {
                let item = summaryMap[slotData.productId] || getOrCreateCustomProduct(slotData.productName, slotData.productCode);
                item.totalPieces += parseInt(slotData.quantity || 0);
                const parsedLoc = formatLocationName(locId);
                if (!item.locations.includes(parsedLoc)) {
                    item.locations.push(parsedLoc);
                }
            }
        });

        renderTable(Object.values(summaryMap));
    }

    // Zamienia np. "RA-P5-K20" na czytelny tekst "Regał A, Poziom 5, Kolumna 20"
    function formatLocationName(locId) {
        // Przykładowy format z Twojego kodu: RACK-LEVEL-COL lub R[rack]-P[level]-K[col]
        const match = locId.match(/R([A-D])-P(\d+)-K(\d+)/i) || locId.match(/R([A-D])-(\d+)-(\d+)/i);
        if (match) {
            return `Regał ${match[1].toUpperCase()}, Poziom ${match[2]}, Kolumna ${match[3]}`;
        }
        return locId; // awaryjnie zwraca oryginał
    }

    // Wyświetlanie danych w tabeli HTML
    function renderTable(dataArray) {
        const tbody = document.getElementById('summaryTableBody');
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();

        const filtered = dataArray.filter(item => 
            item.name.toLowerCase().includes(searchTerm) || 
            item.code.toLowerCase().includes(searchTerm)
        );

        if (filtered.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #64748b; padding: 30px;">Brak pasujących produktów.</td></tr>`;
            return;
        }

        let html = '';
        filtered.forEach(item => {
            // Pomiń produkty, które mają wszędzie 0 i brak lokalizacji (opcjonalnie)
            if (item.totalCartons === 0 && item.totalPieces === 0 && item.locations.length === 0) return;

            const locsHtml = item.locations.length > 0 
                ? item.locations.map(l => `<span class="location-tag">📍 ${l}</span>`).join(' ')
                : '<span style="color:#94a3b8; font-style:italic;">Brak w magazynie</span>';

            html += `
                <tr>
                    <td>
                        <strong style="font-size: 15px; color: #0f172a;">${item.name}</strong><br>
                        <span style="font-size: 12px; color: #64748b;">Kod: ${item.code}</span>
                    </td>
                    <td><span class="badge-cartons">${item.totalCartons} k</span></td>
                    <td><span class="badge-pieces">${item.totalPieces} szt.</span></td>
                    <td>${locsHtml}</td>
                </tr>
            `;
        });

        tbody.innerHTML = html;
    }

    // Obsługa wyszukiwarki na stronie
    document.getElementById('searchInput').addEventListener('input', generateSummary);

    // Start
    initDataListener();
</script>

</body>
</html>
