<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSL PDF Parser & OCR</title>
  
  <!-- PDF.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- Tesseract.js CDN (OCR) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 1200px;
      width: 100%;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 30px;
    }

    h1 {
      margin-top: 0;
      color: #333;
      font-size: 24px;
      text-align: center;
    }

    .upload-box {
      border: 2px dashed #6c5ce7;
      background-color: #f9f8ff;
      border-radius: 8px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 20px;
    }

    .upload-box:hover {
      background-color: #f0edff;
      border-color: #5b4bc4;
    }

    .upload-box input[type="file"] {
      display: none;
    }

    .upload-icon {
      font-size: 40px;
      color: #6c5ce7;
      margin-bottom: 10px;
    }

    .status {
      margin: 15px 0;
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 14px;
      display: none;
    }

    .status.info {
      display: block;
      background-color: #e3f2fd;
      color: #0d47a1;
      border: 1px solid #bbdefb;
    }

    .status.error {
      display: block;
      background-color: #ffebee;
      color: #b71c1c;
      border: 1px solid #ffcdd2;
    }

    .status.success {
      display: block;
      background-color: #e8f5e9;
      color: #1b5e20;
      border: 1px solid #c8e6c9;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      font-size: 13px;
    }

    th, td {
      border: 1px solid #e0e0e0;
      padding: 10px 12px;
      text-align: left;
    }

    th {
      background-color: #6c5ce7;
      color: white;
      font-weight: 600;
    }

    tr:nth-child(even) {
      background-color: #f8f9fa;
    }

    tr:hover {
      background-color: #f1f3f5;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(0,0,0,0.1);
      border-left-color: #0d47a1;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Generator GM-03-01 / Parser OSL</h1>

    <div class="upload-box" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <div class="upload-icon">📄</div>
      <strong>Kliknij lub przeciągnij plik PDF (OSL) tutaj</strong>
      <p style="margin: 5px 0 0 0; color: #666; font-size: 13px;">Obsługuje cyfrowe pliki PDF oraz skany (OCR)</p>
      <input type="file" id="fileInput" accept="application/pdf" onchange="handleFileSelect(event)">
    </div>

    <div id="statusBox" class="status"></div>

    <div id="tableContainer"></div>
  </div>

  <script>
    // Konfiguracja PDF.js Worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const dropZone = document.getElementById('dropZone');
    const statusBox = document.getElementById('statusBox');
    const tableContainer = document.getElementById('tableContainer');

    // Obsługa Drag & Drop
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.style.backgroundColor = '#f0edff';
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.style.backgroundColor = '#f9f8ff';
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.style.backgroundColor = '#f9f8ff';
      if (e.dataTransfer.files.length > 0) {
        processFile(e.dataTransfer.files[0]);
      }
    });

    function handleFileSelect(event) {
      if (event.target.files.length > 0) {
        processFile(event.target.files[0]);
      }
    }

    function showStatus(text, type = 'info', showSpinner = false) {
      statusBox.className = `status ${type}`;
      statusBox.innerHTML = showSpinner ? `<span class="spinner"></span>${text}` : text;
    }

    async function processFile(file) {
      if (file.type !== 'application/pdf') {
        showStatus('Wybierz poprawny plik PDF.', 'error');
        return;
      }

      showStatus('Odczytywanie warstwy tekstowej PDF...', 'info', true);
      tableContainer.innerHTML = '';

      try {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        
        let fullText = '';
        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const textContent = await page.getTextContent();
          const pageText = textContent.items.map(item => item.str).join(' ');
          fullText += pageText + '\n';
        }

        // Faza 1: Próba odczytu z cyfrowego tekstu
        let items = parseOSLText(fullText);

        // Faza 2: Jeśli brak wyników – uruchom OCR (Fallback dla skanów)
        if (items.length === 0) {
          showStatus('Wykryto skan bez warstwy tekstowej. Uruchamianie silnika OCR (Tesseract)...', 'info', true);
          
          let ocrText = '';
          const worker = await Tesseract.createWorker('pol');

          for (let i = 1; i <= pdf.numPages; i++) {
            showStatus(`Przetwarzanie OCR strony ${i} z ${pdf.numPages}...`, 'info', true);
            const page = await pdf.getPage(i);
            const canvas = await renderPageToCanvas(page);
            const { data: { text } } = await worker.recognize(canvas);
            ocrText += text + '\n';
          }

          await worker.terminate();
          items = parseOSLText(ocrText);
        }

        if (items.length === 0) {
          throw new Error('Nie odnaleziono pozycji towarowych w pliku. Upewnij się, że dokument zawiera tabelę OSL.');
        }

        showStatus(`Pomyślnie przetworzono plik. Znaleziono pozycji: ${items.length}`, 'success');
        renderTable(items);

      } catch (err) {
        showStatus(`Błąd: ${err.message}`, 'error');
        console.error(err);
      }
    }

    // Renderowanie strony PDF do Canvas dla OCR
    async function renderPageToCanvas(pdfPage) {
      const viewport = pdfPage.getViewport({ scale: 2.0 });
      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d');
      canvas.height = viewport.height;
      canvas.width = viewport.width;

      await pdfPage.render({ canvasContext: context, viewport: viewport }).promise;
      return canvas;
    }

    // Logika parsująca tabelę z surowego tekstu
    function parseOSLText(rawText) {
      const items = [];
      const cleanedText = rawText.replace(/\|/g, ' ');

      // Regex dopasowany do pozycji OSL (z uwzględnieniem kodów alfanumerycznych)
      const rowRegex = /([A-Z0-9]+)\s+([A-Z0-9]+)\s+(\d{2}-[A-Z]{3}-\d{2})\s+(.+?)\s+(\d{8})\s+([A-Z]{2})\s+([\d.,]+)\s+([\d.,]+)\s+([\d.,]+)\s+([\d.,]+)/gm;

      let match;
      while ((match = rowRegex.exec(cleanedText)) !== null) {
        items.push({
          itemNumber: match[1].trim(),
          lotId: match[2].trim(),
          expiryDate: match[3].trim(),
          description: match[4].trim(),
          commodityCode: match[5].trim(),
          origin: match[6].trim(),
          qtyUnits: parseFormattedNumber(match[7]),
          qtyCases: parseFormattedNumber(match[8]),
          netWeight: parseFormattedNumber(match[9]),
          grossWeight: parseFormattedNumber(match[10])
        });
      }

      return items;
    }

    function parseFormattedNumber(val) {
      if (!val) return 0;
      const clean = val.replace(/\./g, '').replace(',', '.');
      const parsed = parseFloat(clean);
      return isNaN(parsed) ? 0 : parsed;
    }

    // Wyświetlanie wyników w tabeli HTML
    function renderTable(items) {
      let html = `
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Kod (SKU)</th>
              <th>Nr Partii (LOT)</th>
              <th>Data Ważności</th>
              <th>Nazwa Towaru</th>
              <th>Kod Taryfy</th>
              <th>Kraj</th>
              <th>Ilość (Szt)</th>
              <th>Kartonów</th>
              <th>Waga Netto (kg)</th>
              <th>Waga Brutto (kg)</th>
            </tr>
          </thead>
          <tbody>
      `;

      items.forEach((item, index) => {
        html += `
          <tr>
            <td>${index + 1}</td>
            <td><strong>${item.itemNumber}</strong></td>
            <td>${item.lotId}</td>
            <td>${item.expiryDate}</td>
            <td>${item.description}</td>
            <td>${item.commodityCode}</td>
            <td>${item.origin}</td>
            <td>${item.qtyUnits.toLocaleString('pl-PL')}</td>
            <td>${item.qtyCases.toLocaleString('pl-PL')}</td>
            <td>${item.netWeight.toLocaleString('pl-PL', { minimumFractionDigits: 2 })}</td>
            <td>${item.grossWeight.toLocaleString('pl-PL', { minimumFractionDigits: 2 })}</td>
          </tr>
        `;
      });

      html += '</tbody></table>';
      tableContainer.innerHTML = html;
    }
  </script>
</body>
</html>
