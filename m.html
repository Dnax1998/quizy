<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Wideo z Tekstu</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            text-align: center;
            color: #00d2ff;
            font-size: 22px;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #151522;
            color: #fff;
            font-size: 16px;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        #preview-container {
            margin-top: 20px;
            text-align: center;
        }
        canvas {
            width: 100%;
            max-height: 250px;
            background: #000;
            border-radius: 10px;
            border: 2px dashed #444;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        video {
            width: 100%;
            border-radius: 10px;
            margin-top: 15px;
        }
        .status {
            text-align: center;
            margin-top: 10px;
            font-style: italic;
            color: #aaa;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Generator Wideo z Tekstu</h2>
    
    <label for="textInput">Wpisz tekst do wygenerowania na wideo:</label>
    <textarea id="textInput" placeholder="Napisz coś tutaj...">Cześć! To jest testowe wideo generowane na telefonie.</textarea>
    
    <button id="generateBtn" onclick="startGeneration()">Generuj Wideo</button>
    <div id="status" class="status"></div>

    <div id="preview-container">
        <!-- Używamy elementu Canvas zamiast zwykłego Div dla kompatybilności z Safari -->
        <canvas id="videoCanvas" width="640" height="360"></canvas>
        
        <video id="resultVideo" controls style="display:none;"></video>
        <a id="downloadLink" style="display:none; margin-top: 10px;" download="wygenerowany_film.mp4">Pobierz plik Wideo</a>
    </div>
</div>

<script>
const canvas = document.getElementById('videoCanvas');
const ctx = canvas.getContext('2d');

// Początkowy ekran na płótnie
function drawSplash() {
    ctx.fillStyle = '#0b0b16';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#aaa';
    ctx.font = '24px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Wpisz tekst i kliknij przycisk...', canvas.width / 2, canvas.height / 2);
}
drawSplash();

async function startGeneration() {
    const text = document.getElementById('textInput').value.trim();
    const btn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    const videoElement = document.getElementById('resultVideo');
    const downloadLink = document.getElementById('downloadLink');

    if (!text) {
        alert('Proszę wpisać jakiś tekst!');
        return;
    }

    btn.disabled = true;
    videoElement.style.display = 'none';
    downloadLink.style.display = 'none';
    status.innerText = "Synteza mowy i generowanie klatek...";

    if (!('speechSynthesis' in window)) {
        alert('Twoja przeglądarka nie wspiera syntezy mowy!');
        btn.disabled = false;
        return;
    }

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'pl-PL';

    // Sprawdzenie wsparcia canvas.captureStream
    if (!canvas.captureStream) {
        alert('Twoja przeglądarka Safari w tej wersji nie obsługuje nagrywania Canvas. Uaktualnij system iOS lub użyj przeglądarki z silnikiem Chromium.');
        btn.disabled = false;
        return;
    }

    try {
        const stream = canvas.captureStream(30); // 30 klatek na sekundę
        
        // Wybór odpowiedniego formatu wideo wspieranego przez urządzenie
        let options = { mimeType: 'video/webm' };
        if (MediaRecorder.isTypeSupported('video/mp4')) {
            options = { mimeType: 'video/mp4' };
        } else if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) {
            options = { mimeType: 'video/webm;codecs=vp9' };
        }

        const mediaRecorder = new MediaRecorder(stream, options);
        const recordedChunks = [];

        mediaRecorder.ondataavailable = (event) => {
            if (event.data.size > 0) {
                recordedChunks.push(event.data);
            }
        };

        mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: options.mimeType });
            const videoURL = URL.createObjectURL(blob);
            videoElement.src = videoURL;
            videoElement.style.display = 'block';
            downloadLink.href = videoURL;
            downloadLink.download = options.mimeType.includes('mp4') ? 'film.mp4' : 'film.webm';
            downloadLink.style.display = 'inline-block';
            status.innerText = "Wygenerowano pomyślnie!";
            btn.disabled = false;
        };

        // Animacja tekstu na płótnie w trakcie mówienia
        let animationFrameId;
        function animateText() {
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#00d2ff';
            ctx.font = 'bold 28px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // Proste zawijanie linii tekstu
            wrapText(ctx, text, canvas.width / 2, canvas.height / 2, canvas.width - 80, 40);
            
            animationFrameId = requestAnimationFrame(animateText);
        }

        mediaRecorder.start();
        animateText();
        window.speechSynthesis.speak(utterance);

        utterance.onend = () => {
            setTimeout(() => {
                cancelAnimationFrame(animationFrameId);
                mediaRecorder.stop();
            }, 500);
        };

        utterance.onerror = () => {
            cancelAnimationFrame(animationFrameId);
            mediaRecorder.stop();
            status.innerText = "Błąd syntezy mowy.";
            btn.disabled = false;
        };

    } catch (e) {
        console.error(e);
        status.innerText = "Błąd: " + e.message;
        btn.disabled = false;
    }
}

// Pomocnicza funkcja do zawijania tekstu w canvas
function wrapText(context, text, x, y, maxWidth, lineHeight) {
    const words = text.split(' ');
    let line = '';
    let testLine = '';
    let lines = [];

    for(let n = 0; n < words.length; n++) {
        testLine += words[n] + ' ';
        const metrics = context.measureText(testLine);
        const testWidth = metrics.width;
        if (testWidth > maxWidth && n > 0) {
            lines.push(line);
            line = words[n] + ' ';
            testLine = words[n] + ' ';
        } else {
            line = testLine;
        }
    }
    lines.push(line);
    
    let startY = y - ((lines.length - 1) * lineHeight) / 2;
    for(let k = 0; k < lines.length; k++) {
        context.fillText(lines[k], x, startY + (k * lineHeight));
    }
}
</script>

</body>
</html>
