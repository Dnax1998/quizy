<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porównywarka Składów z OCR</title>
    <!-- Dołączamy bibliotekę Tesseract.js do rozpoznawania tekstu -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        :root {
            --primary-color: #4f46e5;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        p.subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .card h2 {
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 15px;
            color: #334155;
        }

        .upload-box {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s;
            margin-bottom: 15px;
            background: #fafafa;
        }

        .upload-box:hover {
            border-color: var(--primary-color);
        }

        .upload-box input {
            display: none;
        }

        .preview-img {
            max-width: 100%;
            max-height: 200px;
            display: none;
            margin: 10px auto;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .loading {
            font-size: 0.9rem;
            color: var(--primary-color);
            text-align: center;
            margin-top: 5px;
            display: none;
            font-weight: 600;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            resize: vertical;
            font-family: inherit;
            box-sizing: border-box;
        }

        .actions {
            text-align: center;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
        }

        button:hover {
            background-color: #4338ca;
        }

        .result-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }

        .result-section h3 {
            margin-top: 0;
            color: var(--primary-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Porównywarka Składów</h1>
        <p class="subtitle">Wgraj zdjęcia – aplikacja automatycznie odczyta i porówna składy.</p>

        <div class="grid">
            <!-- Produkt 1 -->
            <div class="card">
                <h2>Produkt A</h2>
                <div class="upload-box" onclick="document.getElementById('file1').click()">
                    <span>Kliknij, aby wgrać zdjęcie 1</span>
                    <input type="file" id="file1" accept="image/*" onchange="processImage(event, 'preview1', 'text1', 'loading1')">
                </div>
                <img id="preview1" class="preview-img" alt="Podgląd 1">
                <div id="loading1" class="loading">⏳ Odczytuję tekst ze zdjęcia...</div>
                
                <label for="text1" style="display:block; margin-top:15px; margin-bottom:5px; font-size:0.9rem; font-weight:600;">Odczytany skład (możesz edytować):</label>
                <textarea id="text1" placeholder="Tutaj pojawi się odczytany tekst..."></textarea>
            </div>

            <!-- Produkt 2 -->
            <div class="card">
                <h2>Produkt B</h2>
                <div class="upload-box" onclick="document.getElementById('file2').click()">
                    <span>Kliknij, aby wgrać zdjęcie 2</span>
                    <input type="file" id="file2" accept="image/*" onchange="processImage(event, 'preview2', 'text2', 'loading2')">
                </div>
                <img id="preview2" class="preview-img" alt="Podgląd 2">
                <div id="loading2" class="loading">⏳ Odczytuję tekst ze zdjęcia...</div>
                
                <label for="text2" style="display:block; margin-top:15px; margin-bottom:5px; font-size:0.9rem; font-weight:600;">Odczytany skład (możesz edytować):</label>
                <textarea id="text2" placeholder="Tutaj pojawi się odczytany tekst..."></textarea>
            </div>
        </div>

        <div class="actions">
            <button onclick="compareIngredients()">Porównaj składy</button>
        </div>

        <div id="result" class="result-section">
            <h3>Wynik porównania</h3>
            <div id="result-content"></div>
        </div>
    </div>

    <script>
        async function processImage(event, previewId, textId, loadingId) {
            const file = event.target.files[0];
            if (!file) return;

            // 1. Pokaż podgląd zdjęcia
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById(previewId);
                img.src = e.target.result;
                img.style.display = 'block';
            }
            reader.readAsDataURL(file);

            // 2. Pokaż komunikat ładowania i uruchom Tesseract OCR (język polski i angielski)
            const loadingBox = document.getElementById(loadingId);
            const textBox = document.getElementById(textId);
            
            loadingBox.style.display = 'block';
            textBox.value = "Trwa skanowanie tekstu...";

            try {
                const result = await Tesseract.recognize(file, 'pol+eng');
                textBox.value = result.data.text.trim();
            } catch (error) {
                console.error(error);
                textBox.value = "Błąd podczas odczytu tekstu. Wpisz go ręcznie.";
            } finally {
                loadingBox.style.display = 'none';
            }
        }

        function compareIngredients() {
            const t1 = document.getElementById('text1').value.trim();
            const t2 = document.getElementById('text2').value.trim();
            const resultBox = document.getElementById('result');
            const resultContent = document.getElementById('result-content');

            if (!t1 || !t2) {
                alert('Upewnij się, że oba pola zawierają tekst składników.');
                return;
            }

            // Dzielimy tekst po przecinkach, średnikach lub nowych liniach
            const parseText = (text) => {
                return text
                    .replace(/[\n\r]+/g, ',') // zamień nowe linie na przecinki
                    .split(/[,;]/)
                    .map(s => s.trim().toLowerCase())
                    .filter(s => s.length > 2); // odrzuć bardzo krótkie znaki
            };

            const ingredients1 = parseText(t1);
            const ingredients2 = parseText(t2);

            const set1 = new Set(ingredients1);
            const set2 = new Set(ingredients2);

            const onlyIn1 = ingredients1.filter(item => !set2.has(item));
            const onlyIn2 = ingredients2.filter(item => !set1.has(item));
            const common = ingredients1.filter(item => set2.has(item));

            let html = `<p><strong>Wspólne składniki (${common.length}):</strong> ${common.join(', ') || 'Brak'}</p>`;
            html += `<p style="color: #dc2626;"><strong>Tylko w Produkcie A (${onlyIn1.length}):</strong> ${onlyIn1.join(', ') || 'Brak'}</p>`;
            html += `<p style="color: #16a34a;"><strong>Tylko w Produkcie B (${onlyIn2.length}):</strong> ${onlyIn2.join(', ') || 'Brak'}</p>`;

            resultContent.innerHTML = html;
            resultBox.style.display = 'block';
        }
    </script>

</body>
</html>
