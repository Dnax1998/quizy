<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Wideo z Tekstu</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            text-align: center;
            color: #00d2ff;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #151522;
            color: #fff;
            font-size: 16px;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        button:hover {
            opacity: 0.9;
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        #preview-container {
            margin-top: 25px;
            text-align: center;
        }
        /* Ekran wideo (scena) */
        #video-stage {
            width: 100%;
            height: 250px;
            background: #000;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            border: 2px dashed #444;
            position: relative;
            overflow: hidden;
            margin-bottom: 15px;
        }
        #animated-text {
            font-size: 20px;
            text-align: center;
            color: #fff;
            word-break: break-word;
        }
        video {
            width: 100%;
            border-radius: 10px;
            margin-top: 15px;
        }
        .status {
            text-align: center;
            margin-top: 10px;
            font-style: italic;
            color: #aaa;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Generator Wideo z Tekstu</h2>
    
    <label for="textInput">Wpisz tekst do wygenerowania na wideo:</label>
    <textarea id="textInput" placeholder="Napisz coś tutaj...">Cześć! To jest testowe wideo wygenerowane automatycznie ze zwykłego tekstu za pomocą sztucznej inteligencji przeglądarki.</textarea>
    
    <button id="generateBtn" onclick="startGeneration()">Generuj Wideo</button>
    <div id="status" class="status"></div>

    <!-- Scena, która będzie nagrywana -->
    <div id="preview-container">
        <div id="video-stage">
            <div id="animated-text">Wpisz tekst i kliknij przycisk...</div>
        </div>
        
        <!-- Tutaj pojawi się gotowy film -->
        <video id="resultVideo" controls style="display:none;"></video>
        <a id="downloadLink" style="display:none; margin-top: 10px; display: inline-block;" download="wygenerowany_film.webm">Pobierz plik Wideo (.webm)</a>
    </div>
</div>

<script>
async function startGeneration() {
    const text = document.getElementById('textInput').value.trim();
    const btn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    const stageText = document.getElementById('animated-text');
    const videoElement = document.getElementById('resultVideo');
    const downloadLink = document.getElementById('downloadLink');

    if (!text) {
        alert('Proszę wpisać jakiś tekst!');
        return;
    }

    // Reset widoku
    btn.disabled = true;
    videoElement.style.display = 'none';
    downloadLink.style.display = 'none';
    status.innerText = "Przygotowywanie nagrania i synteza mowy...";

    // Sprawdzenie syntezy mowy
    if (!('speechSynthesis' in window)) {
        alert('Twoja przeglądarka nie wspiera syntezy mowy!');
        btn.disabled = false;
        return;
    }

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'pl-PL';

    // Przechwytywanie obrazu ze "sceny" za pomocą MediaStream (Canvas/Element DOM)
    const stage = document.getElementById('video-stage');
    
    try {
        // Używamy standardowego streamu z elementu HTML
        const stream = stage.captureStream ? stage.captureStream() : null;
        if (!stream) {
            alert('Twoja przeglądarka nie obsługuje nagrywania elementów (captureStream). Spróbuj w Chrome lub Edge.');
            btn.disabled = false;
            return;
        }

        const mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
        const recordedChunks = [];

        mediaRecorder.ondataavailable = function(event) {
            if (event.data.size > 0) {
                recordedChunks.push(event.data);
            }
        };

        mediaRecorder.onstop = function() {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const videoURL = URL.createObjectURL(blob);
            videoElement.src = videoURL;
            videoElement.style.display = 'block';
            downloadLink.href = videoURL;
            downloadLink.style.display = 'block';
            status.innerText = "Film został wygenerowany pomyślnie!";
            btn.disabled = false;
            stageText.innerText = "Gotowe!";
        };

        // Start nagrywania
        mediaRecorder.start();
        status.innerText = "Nagrywanie wideo w toku...";
        stageText.innerText = text; // Wyświetlanie tekstu na ekranie

        // Start mowy
        window.speechSynthesis.speak(utterance);

        // Kiedy lektor skończy mówić, zatrzymujemy nagrywanie
        utterance.onend = function() {
            // Krótkie opóźnienie dla pewności nagrania końcówki
            setTimeout(() => {
                mediaRecorder.stop();
            }, 500);
        };

        utterance.onerror = function() {
            mediaRecorder.stop();
            status.innerText = "Wystąpił błąd podczas syntezy mowy.";
            btn.disabled = false;
        };

    } catch (e) {
        console.error(e);
        status.innerText = "Błąd: " + e.message;
        btn.disabled = false;
    }
}
</script>

</body>
</html>
